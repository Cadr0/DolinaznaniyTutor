services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolinaznaniy
      POSTGRES_PASSWORD: dolinaznaniy
      POSTGRES_DB: dolinaznaniy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolinaznaniy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
