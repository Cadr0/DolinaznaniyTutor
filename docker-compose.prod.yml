services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolinaznaniy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dolinaznaniy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolinaznaniy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  app:
    image: ghcr.io/cadr0/dolinaznaniy-tutor:${IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dolinaznaniy:${POSTGRES_PASSWORD}@db:5432/dolinaznaniy?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://diary-ai.ru}
      AUTH_SECRET: ${AUTH_SECRET}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      GIT_COMMIT_FULL: ${GIT_COMMIT_FULL:-unknown}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@diary-ai.ru}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app

  migrate:
    image: ghcr.io/cadr0/dolinaznaniy-tutor-migrate:${IMAGE_TAG:-main}
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dolinaznaniy:${POSTGRES_PASSWORD}@db:5432/dolinaznaniy?schema=public
    networks:
      - app

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
