services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolinaznaniy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dolinaznaniy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolinaznaniy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_FULL: ${GIT_COMMIT_FULL:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dolinaznaniy:${POSTGRES_PASSWORD}@db:5432/dolinaznaniy?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://111.88.118.35}
      AUTH_SECRET: ${AUTH_SECRET}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      GIT_COMMIT_FULL: ${GIT_COMMIT_FULL:-unknown}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dolinaznaniy:${POSTGRES_PASSWORD}@db:5432/dolinaznaniy?schema=public
    networks:
      - app
    profiles:
      - tools

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
