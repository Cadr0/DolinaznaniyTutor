name: Rollback on VDS

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Git commit (short or full), e.g. a5ba6ab"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          command_timeout: 10m
          envs: GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_PAT secret is not set"
              exit 1
            fi
            APP_DIR=/opt/dolinaznaniy
            TARGET="${{ github.event.inputs.commit }}"
            cd "$APP_DIR"
            git fetch origin main
            git checkout "$TARGET"
            COMMIT_FULL=$(git rev-parse HEAD)
            export IMAGE_TAG="$COMMIT_FULL"
            export GHCR_USER=cadr0
            export GIT_COMMIT=$(git rev-parse --short HEAD)
            export GIT_COMMIT_FULL="$COMMIT_FULL"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u cadr0 --password-stdin
            fi
            docker compose -f docker-compose.prod.yml pull app migrate
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans
            mkdir -p .deploy
            printf '{"commit":"%s","commitFull":"%s","deployedAt":"%s","branch":"rollback","imageTag":"%s"}\n' \
              "$GIT_COMMIT" "$COMMIT_FULL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$IMAGE_TAG" > .deploy/deploy-info.json
            echo "Rolled back to ${GIT_COMMIT}"

      - name: Verify production health after rollback
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -fsS --max-time 5 https://diary-ai.ru/api/health || true)
            VERSION=$(curl -fsS --max-time 5 https://diary-ai.ru/api/version || true)
            if echo "$HEALTH" | grep -q '"status":"ok"' && echo "$VERSION" | grep -q '"commitFull":"'; then
              echo "Production is healthy after rollback."
              exit 0
            fi
            sleep 10
          done
          echo "Rollback verification failed."
          echo "Health: $HEALTH"
          echo "Version: $VERSION"
          exit 1
