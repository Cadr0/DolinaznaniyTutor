name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/cadr0/dolinaznaniy-tutor
  MIGRATE_IMAGE: ghcr.io/cadr0/dolinaznaniy-tutor-migrate

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile for reproducible builds
        run: npm install --package-lock-only --ignore-scripts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:main
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_FULL=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:main
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          command_timeout: 10m
          debug: true
          envs: GHCR_TOKEN
          script_stop: true
          script: |
            set -euxo pipefail
            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_PAT secret is not set"
              exit 1
            fi
            APP_DIR=/opt/dolinaznaniy
            REPO_URL="https://github.com/Cadr0/DolinaznaniyTutor.git"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if ! command -v git >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq git
            fi
            if [ ! -d .git ]; then
              echo "==> git init in existing app dir"
              git init
            fi
            git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
            git fetch origin main --depth 1
            git reset --hard FETCH_HEAD
            if [ ! -f infra/deploy.sh ]; then
              echo "ERROR: infra/deploy.sh not found in $(pwd)"
              ls -la infra || ls -la
              exit 1
            fi
            chmod +x infra/git-sync.sh infra/deploy.sh 2>/dev/null || chmod +x infra/deploy.sh
            export IMAGE_TAG=${{ github.sha }}
            export GHCR_USER=cadr0
            bash infra/deploy.sh

      - name: Verify production health
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -fsS --max-time 5 https://diary-ai.ru/api/health || true)
            VERSION=$(curl -fsS --max-time 5 https://diary-ai.ru/api/version || true)
            if echo "$HEALTH" | grep -q '"status":"ok"' && echo "$VERSION" | grep -q '"commitFull":"${{ github.sha }}"'; then
              echo "Production is healthy and on expected commit."
              exit 0
            fi
            sleep 10
          done
          echo "Production verification failed."
          echo "Health: $HEALTH"
          echo "Version: $VERSION"
          exit 1
