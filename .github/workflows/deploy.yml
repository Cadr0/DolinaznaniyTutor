name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/cadr0/dolinaznaniy-tutor
  MIGRATE_IMAGE: ghcr.io/cadr0/dolinaznaniy-tutor-migrate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile for reproducible builds
        run: npm install --package-lock-only

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:main
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_FULL=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:main
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          command_timeout: 10m
          envs: GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            if [ ! -d /opt/dolinaznaniy/.git ]; then
              apt-get update -qq
              apt-get install -y -qq git
              git clone https://github.com/Cadr0/DolinaznaniyTutor.git /opt/dolinaznaniy
            fi
            cd /opt/dolinaznaniy
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_TAG=main
            export GHCR_USER=cadr0
            bash infra/deploy.sh
